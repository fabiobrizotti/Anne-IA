<head>
    <title>Login - Anne IA</title>
    <link href="src/css/reset.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/login.css">
</head>
<section class="login">

    <div class="login__texto">
        <div class="login__branding">
            <img src="src/assets/logo.svg" alt="Logo Branding" draggable="false">
        </div>
        <span class="login__tag">Acesso ao sistema</span>
        <h1>Entre para continuar</h1>
        <p>Informe seu usuário e senha para acessar os recursos do sistema.</p>
    </div>

    <form id="loginForm" class="login__formulario">
        <h2>Login</h2>
        <label for="username">Usuário:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
    </form>
</section>
