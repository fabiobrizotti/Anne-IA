services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "${CHAVE_PHPMYADMIN_PORT}:80"
    environment:
      TZ: America/Sao_Paulo
      PMA_HOST: ${CHAVE_PHPMYADMIN_HOST}
      MYSQL_ROOT_PASSWORD: ${CHAVE_MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
      - n8n
    networks:
      - private_network

  pgadmin4:
    image: elestio/pgadmin:REL-9_16
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${CHAVE_PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${CHAVE_PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${CHAVE_PGADMIN_LISTEN_PORT}
      SOFTWARE_PASSWORD: ${CHAVE_PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${CHAVE_PGADMIN_LISTEN_PORT}:8082"
    volumes:
      - ./dados/pgadmin:/var/lib/pgadmin
      - ./dados/pgadmin/:/pgadmin4/servers.json
    depends_on:
      - db-evolution
      - n8n
    networks:
      - private_network

  redisinsight:
    image: redis/redisinsight:3.6.0
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "${CHAVE_REDIS_INSIGHT_PORT}:5540"
    volumes:
      - ./dados/redisinsight:/db
    depends_on:
      - redis
      - n8n
    networks:
      - private_network