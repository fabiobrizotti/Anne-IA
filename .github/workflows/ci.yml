name: Anne-IA CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-sast:
    name: lint-and-sast
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Validação de Sintaxe JavaScript (node --check)
        run: |
          find dashboard/src -name "*.js" -exec node --check {} +
          find dashboard/tests -name "*.js" -exec node --check {} +
          find scripts -name "*.js" -exec node --check {} +

      - name: Validação de Scripts Shell (ShellCheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: Validação de Sintaxe Python (py_compile)
        run: |
          python3 -m py_compile $(git ls-files "*.py" 2>/dev/null || true)

      - name: Validação de Workflows GitHub Actions (actionlint)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)"
          ./actionlint -color

      - name: Inicializar CodeQL SAST (JavaScript)
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: javascript

      - name: Executar Análise CodeQL
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10

  sca-audit:
    name: sca-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Auditoria SCA de Dependências Dashboard (npm audit)
        run: |
          cd dashboard
          npm audit --audit-level=high

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Instalar Dependências do Dashboard
        run: |
          cd dashboard
          npm ci --ignore-scripts

      - name: Executar Suíte de Testes Unitários Nativos (node:test)
        run: |
          cd dashboard
          npm test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Completo do Repositório (fetch-depth: 0)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Escaneamento de Segredos com Gitleaks
        uses: gitleaks/gitleaks-action@f91b498f3c7809635fae7df07a6a438ee2e89ab0 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: dast
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Gerar Arquivo .env de Teste
        run: |
          cp .env.example .env
          ./scripts/generate-passwords.sh
          # Chaves de teste para PII LGPD
          echo "CPF_ENC_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" >> .env
          echo "CPF_HMAC_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" >> .env

      - name: Subir Infraestrutura Mínima para Pentest (Postgres & Dashboard)
        run: |
          docker compose up -d postgres dashboard
          # Aguarda healthy do Postgres e Dashboard
          timeout 60 bash -c 'until docker compose ps postgres | grep -q "(healthy)"; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://127.0.0.1:3000/api/v1/health | grep -q "ok"; do sleep 2; done'

      - name: Injetar Fixtures Sintéticas Multi-Tenant
        run: |
          docker compose exec -T postgres psql -U "$(grep '^POSTGRES_USER=' .env | cut -d= -f2)" -d "$(grep '^POSTGRES_DB=' .env | cut -d= -f2)" < setup/postgres/fixtures-test.sql

      - name: Executar Bateria DAST / Pentest Automatizado
        run: |
          chmod +x tests/pentest_dashboard.sh
          ./tests/pentest_dashboard.sh

      - name: Teardown dos Containers
        if: always()
        run: |
          docker compose down -v
