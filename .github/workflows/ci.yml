name: Anne-IA CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-sast:
    name: lint-and-sast
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Validação de Sintaxe JavaScript (node --check)
        run: |
          find dashboard/src -name "*.js" -exec node --check {} +
          find dashboard/tests -name "*.js" -exec node --check {} +
          find scripts -name "*.js" -exec node --check {} +

      - name: Validação de Scripts Shell (ShellCheck)
        run: |
          # Versão PINADA: o shellcheck do apt (ubuntu-24.04) é 0.9.x e reporta
          # SC2317 em funções chamadas apenas via `trap`, que a 0.11 não emite.
          # Usar a mesma versão do ambiente de desenvolvimento evita "passa aqui,
          # falha no CI".
          # -S warning: achados SC2015/SC2016/SC2329 são informativos e
          # intencionais em regex/heredocs e funções chamadas via trap.
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 \
            -S warning scripts/*.sh tests/*.sh

      - name: Validação de Sintaxe Python (py_compile)
        run: |
          git ls-files -z "*.py" | xargs -0 -r python3 -m py_compile

      - name: Validação de Workflows GitHub Actions (actionlint)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)"
          ./actionlint -color

      - name: Inicializar CodeQL SAST (JavaScript)
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: javascript

      - name: Executar Análise CodeQL
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10

  sca-audit:
    name: sca-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Auditoria SCA de Dependências Dashboard (npm audit)
        run: |
          cd dashboard
          npm audit --audit-level=high

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Instalar Dependências do Dashboard
        run: |
          cd dashboard
          npm ci --ignore-scripts

      - name: Executar Suíte de Testes Unitários Nativos (node:test)
        run: |
          cd dashboard
          npm test

  schema-idempotency:
    name: schema-idempotency
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar Idempotência e Boot Limpo do init.sql
        run: |
          # Sobe um Postgres DESCARTÁVEL e prova:
          #   1. boot limpo (volume vazio) sem ERROR
          #   2. reaplicação em banco populado sem ERROR e sem perda de dado
          #   3. 51 triggers de auditoria, seed admin/*/*, DML real
          # É o mesmo teste que o ./scripts/update.sh depende para reaplicar
          # o schema com segurança na VPS.
          chmod +x tests/test_init_sql.sh
          ./tests/test_init_sql.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout Completo do Repositório (fetch-depth: 0)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Escaneamento de Segredos com Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: dast
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Gerar Arquivo .env de Teste
        run: |
          # sync-env.sh cria o .env a partir do .env.example, gera as senhas
          # Base62 e é exatamente o caminho usado em produção (não um atalho).
          ./scripts/sync-env.sh
          # Chaves de teste para PII LGPD
          echo "CPF_ENC_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" >> .env
          echo "CPF_HMAC_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" >> .env

      - name: Subir Infraestrutura Mínima para Pentest (Postgres, PgBouncer & Dashboard)
        run: |
          # Serviço correto: db-evolution (o nome "postgres" não existe no compose)
          # PgBouncer é obrigatório: Dashboard conecta via PgBouncer (DATABASE_URL)
          docker compose up -d db-evolution pgbouncer dashboard
          # Aguarda healthy do banco, pgbouncer e o dashboard respondendo na porta do host
          # (DASHBOARD_PORT, não a 3000 que é interna do container)
          DASH_PORT="$(grep '^DASHBOARD_PORT=' .env | cut -d= -f2)"
          timeout 180 bash -c 'until docker compose ps db-evolution | grep -q "(healthy)"; do sleep 2; done'
          timeout 180 bash -c 'until docker compose ps pgbouncer | grep -q "(healthy)"; do sleep 2; done'
          timeout 180 bash -c "until curl -s http://127.0.0.1:${DASH_PORT}/api/health | grep -q 'ok'; do sleep 2; done"

      - name: Injetar Fixtures Sintéticas Multi-Tenant
        run: |
          # Tabelas de negócio vivem no banco anneia (criado pelo init.sql),
          # não em POSTGRES_DB (evolution, controlado pelo Prisma da Evolution API)
          PG_USER="$(grep '^POSTGRES_USER=' .env | cut -d= -f2)"
          docker compose exec -T db-evolution psql -U "${PG_USER}" -d anneia \
            -v ON_ERROR_STOP=1 < setup/postgres/fixtures-test.sql

      - name: Injetar Fixture Sintética do Spend do Gateway
        run: |
          # O DAST não sobe o serviço litellm; sem o spend log o financeiro
          # responde 503 (fail-closed) e o pentest perde casos de vazamento/RBAC.
          PG_USER="$(grep '^POSTGRES_USER=' .env | cut -d= -f2)"
          docker compose exec -T db-evolution psql -U "${PG_USER}" -d anneia \
            -v ON_ERROR_STOP=1 < setup/postgres/fixtures-test-gateway.sql

      - name: Gate de runtime do financeiro (primeiro acesso, pool frio)
        run: |
          # Prova a causa raiz do 503 do DAST, não apenas o literal do timeout:
          # esta é a PRIMEIRA consulta ao gateway após o boot do Dashboard,
          # quando o gatewayPool ainda está frio e o handshake do PgBouncer
          # demorava mais que 2s. O pentest repete a checagem no teste 1.3.
          DASH_PORT="$(grep '^DASHBOARD_PORT=' .env | cut -d= -f2)"
          DASH_USER="$(grep '^DASHBOARD_USERNAME=' .env | cut -d= -f2)"
          DASH_PASS="$(grep '^DASHBOARD_PASSWORD=' .env | cut -d= -f2)"
          HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' -u "${DASH_USER}:${DASH_PASS}" \
            "http://127.0.0.1:${DASH_PORT}/api/v1/financeiro")"
          echo "financeiro (pool frio): HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" = "200"

      - name: Executar Bateria DAST / Pentest Automatizado
        run: |
          chmod +x tests/pentest_dashboard.sh
          ./tests/pentest_dashboard.sh

      - name: Teardown dos Containers
        if: always()
        run: |
          docker compose down -v
