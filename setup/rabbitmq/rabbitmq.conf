# =============================================================================
# RABBITMQ - CONFIGURAÇÃO PRÉ-CONFIGURADA (versionada no repositório)
# =============================================================================
# O arquivo de definições (definitions.json) é gerado pelo entrypoint.sh a partir
# do template (definitions.json.template), substituindo a senha do usuário pela
# variável RABBITMQ_DEFAULT_PASS definida no .env.
# =============================================================================

# Carregamento automático de definições (filas, exchanges e usuários)
load_definitions = /etc/rabbitmq/definitions.json

# Limite de segurança de uso de RAM (ativa backpressure se passar de 60% da RAM)
vm_memory_high_watermark.relative = 0.6

# Limite mínimo de espaço livre em disco
disk_free_limit.relative = 1.0

# Habilita logs simplificados no stdout do contêiner
log.console = true
log.console.level = warning
