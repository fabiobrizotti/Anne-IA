# ============================================================================
# NGINX RATE LIMITING ZONES
# ============================================================================
# Definidas no nível http {} para serem compartilhadas entre server blocks.
# Variáveis injetadas via envsubst no entrypoint.
# ============================================================================

# Login endpoints — muito restritivo (anti brute force)
limit_req_zone $binary_remote_addr zone=login:10m rate=${NGINX_RATE_LIMIT_LOGIN};

# API geral — permissivo para uso normal
limit_req_zone $binary_remote_addr zone=api:10m rate=${NGINX_RATE_LIMIT_API};

# Conexões simultâneas por IP
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Status codes para rate limit / connection limit
limit_req_status 429;
limit_conn_status 429;

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}