# ============================================================================
# NGINX SECURITY HEADERS
# ============================================================================
# Aplicados no server block principal.
# CSP NÃO aplicado aqui — cada backend define o seu (Dashboard tem CSP estrita,
# n8n e pgAdmin quebram com CSP externa).
# ============================================================================

# Oculta versão do nginx
server_tokens off;

# Timeouts de cliente
client_header_timeout 10s;
client_body_timeout 15s;

# Headers de segurança
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS — só se HTTPS (Tailscale não usa HTTPS no container)
# Se terminar TLS no host, habilitar aqui:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Remove headers que vazam informação (moved to proxy-params.conf)
# proxy_hide_header X-Powered-By;
# proxy_hide_header Server;

# X-Request-ID para tracing (gerado pelo nginx se não vier do cliente)
# Requer módulo ngx_http_headers_more_filter_module ou usar $request_id nativo (1.11+)
# add_header X-Request-ID $request_id always;