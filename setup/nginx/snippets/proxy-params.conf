# ============================================================================
# NGINX PROXY PARAMETERS
# ============================================================================
# Configurações padrão para proxy_pass para todos os backends.
# Headers essenciais para que backends vejam IP real do cliente.
# NOTA: Timeouts e buffering são definidos por location, não aqui.
# ============================================================================

# Headers de encaminhamento (críticos para trust proxy nos backends)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-ID $request_id;

# HTTP/1.1 é pré-requisito para (a) WebSocket upgrade e (b) reaproveitamento das
# conexões dos blocos `keepalive` dos upstreams. Definido aqui para valer em
# todos os locations que incluem este snippet.
proxy_http_version 1.1;

# WebSocket support
# ATENÇÃO: Upgrade/Connection são definidos AQUI e valem para todos os locations.
# NÃO redeclare proxy_set_header Upgrade/Connection dentro de um location que
# inclui este snippet: o nginx acumula as duas diretivas e envia o header
# duplicado ("upgrade: websocket, websocket"). O Node concatena headers repetidos
# com ", " e a lib ws do n8n rejeita o handshake com 400 "Invalid Upgrade header"
# (sintoma no editor: "Lost connection to the server").
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Next upstream on error
proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;

# Redirects
proxy_redirect off;

# Remove headers que vazam informação
proxy_hide_header X-Powered-By;
proxy_hide_header Server;