services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:${N8N_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
      - ./workflows:/workflows:rw
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: 'localhost', port: process.env.N8N_PORT, path: '/healthz', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # o 1º boot roda migrations no database.sqlite (pode passar de 50s)
  
# Importador Automatizado direto do GitHub (com suporte a subpastas)
# Idempotente: antes de importar, remove os workflows já existentes no
# database.sqlite (via setup/n8n/clean-workflows.js) para não falhar com
# SQLITE_CONSTRAINT ao recriar workflows com o mesmo ID.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n-import
    profiles: ["setup"]   # Executa apenas sob demanda
    depends_on:
      n8n:
        condition: service_healthy   # evita corrida de migrations no database.sqlite
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./setup/n8n:/setup-n8n:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[n8n-import] Limpando workflows existentes (importação idempotente)..."
        node /setup-n8n/clean-workflows.js || echo "[n8n-import] WARNING: limpeza não aplicada"

        echo "[n8n-import] Baixando workflows do GitHub..."
        mkdir -p /tmp/repo_workflows

        if [ -n "$${GITHUB_TOKEN}" ]; then
          git clone "https://x-access-token:$${GITHUB_TOKEN}@github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows
        else
          git clone "https://github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows
        fi

        echo "[n8n-import] Varrendo e importando todos os .json das subpastas..."
        find /tmp/repo_workflows/workflows -type f -name "*.json" | while read -r file; do
          echo "[n8n-import] Sanitizando e injetando: $$file"
          node /setup-n8n/sanitize-workflow.js "$$file" /tmp/workflow-clean.json || {
            echo "[n8n-import] WARNING: sanitização falhou, pulando $$file"
            continue
          }
          n8n import:workflow --input="/tmp/workflow-clean.json"
        done

        echo "[n8n-import] Desativando (garantia) todos os fluxos importados..."
        n8n unpublish:workflow --all

        echo "[n8n-import] Concluído! Reinicie o n8n para aplicar as mudanças."
    networks:
      - data_net
    restart: "no"

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-anne
    ports:
      - "${RABBITMQ_HOST_BIND}:${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}"
    env_file:
      - .env
    entrypoint: /setup-rabbitmq/entrypoint.sh
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
      - ./setup/rabbitmq:/setup-rabbitmq:ro
      - ./setup/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  evolution-api:
    image: evoapicloud/evolution-api:${EVOLUTION_API_VERSION}
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_HOST_BIND}:${EVOLUTION_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/evolution-api:/evolution/instances
    depends_on:
      - db-evolution
    networks:
      - public_net
      - data_net

  db-evolution:
    image: pgvector/pgvector:${PGVECTOR_VERSION}
    container_name: db-evolution
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_BIND}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./setup/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data_net
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_HOST_BIND}:${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - ./data/redis:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  9router:
    image: decolua/9router:${NINE_ROUTER_VERSION}
    container_name: 9router
    restart: unless-stopped
    ports:
      - "${NINE_ROUTER_HOST_BIND}:${NINE_ROUTER_PORT}:${NINE_ROUTER_CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/9router:/app/data
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: '127.0.0.1', port: process.env.PORT, path: '/', timeout: 2000 }, (res) => { process.exit(res.statusCode < 500 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_HOST_BIND}:${PGADMIN_PORT}:${PGADMIN_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./setup/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy

networks:
  public_net:
    driver: bridge
  data_net:
    driver: bridge