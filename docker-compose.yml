services:
  
  n8n:
    image: n8nio/n8n:2.27.4
    restart: unless-stopped
    ports:
      - "${CHAVE_N8N_PORT}:5678"
    environment:
        # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db-evolution
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${CHAVE_POSTGRES_DB}
      - DB_POSTGRESDB_USER=${CHAVE_POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${CHAVE_POSTGRES_PASSWORD}

      - N8N_BASIC_AUTH_ACTIVE=${CHAVE_N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${CHAVE_N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${CHAVE_N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${CHAVE_N8N_HOST}
      - N8N_PORT=${CHAVE_N8N_PORT}
      - N8N_PROTOCOL=${CHAVE_N8N_PROTOCOL}
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=*

      # n8n Instance Owner Configuration
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=${KEY_N8N_INSTANCE_OWNER_EMAIL}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${KEY_N8N_INSTANCE_OWNER_FIRST_NAME}
      - N8N_INSTANCE_OWNER_LAST_NAME=${KEY_N8N_INSTANCE_OWNER_LAST_NAME}
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${KEY_N8N_INSTANCE_OWNER_PASSWORD_HASH}

        # Instalação automática de nodes da comunidade:
      - N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV=${KEY_N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV}
      - N8N_COMMUNITY_PACKAGES=${KEY_N8N_COMMUNITY_PACKAGES}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
      - ./data/workflows:/backup/workflows
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: 'localhost', port: 5678, path: '/healthz', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    hostname: rabbitmq-anne
    ports:
      - "${CHAVE_RABBITMQ_PORT}:5672"
      - "${CHAVE_RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${CHAVE_RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${CHAVE_RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_ERLANG_COOKIE=${CHAVE_RABBITMQ_COOKIE}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./data/rabbitmq-setup/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./data/rabbitmq-setup/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      - n8n
    networks:
      - private_network

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "${CHAVE_EVOLUTION_API_PORT}:8080"
    environment:
      TZ: America/Sao_Paulo
      SERVER_URL: ${CHAVE_SERVER_URL}
      AUTHENTICATION_API_KEY: ${CHAVE_EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${CHAVE_POSTGRES_USER}:${CHAVE_POSTGRES_PASSWORD}@db-evolution:5432/${CHAVE_POSTGRES_DB}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${CHAVE_REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_VERSION: ${CHAVE_CONFIG_SESSION_PHONE_VERSION}
      CORS_ORIGIN: ${CHAVE_CORS_ORIGIN}
      CORS_METHODS: ${CHAVE_CORS_METHODS}
      CORS_CREDENTIALS: ${CHAVE_CORS_CREDENTIALS}
      WEBHOOK_GLOBAL_ENABLED: ${CHAVE_WEBHOOK_GLOBAL_ENABLED}
      WEBHOOK_GLOBAL_URL: ${CHAVE_WEBHOOK_GLOBAL_URL}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: ${CHAVE_WEBHOOK_EVENTS_MESSAGES_UPSERT}
      WEBHOOK_EVENTS_CONNECTION_UPDATE: ${CHAVE_WEBHOOK_EVENTS_CONNECTION_UPDATE}
    volumes:
      - ./data/evolution-api:/evolution/instances
    depends_on:
      - n8n
      - db-evolution
      - redis
    networks:
      - private_network
  
  db-evolution:
    image: postgres:15-alpine
    container_name: db-evolution
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${CHAVE_POSTGRES_DB}
      POSTGRES_USER: ${CHAVE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHAVE_POSTGRES_PASSWORD}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    depends_on:
      - n8n
    networks:
      - private_network



  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${CHAVE_REDIS_PASSWORD} --appendonly yes
    environment:
      TZ: America/Sao_Paulo
      REDIS_HOST: localhost
      REDIS_PORT: ${CHAVE_REDIS_PORT}
      REDIS_URL: redis://localhost:${CHAVE_REDIS_PORT}
      REDIS_PASSWORD: ${CHAVE_REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - private_network
    depends_on:
      - db-evolution
      - n8n



networks:
  private_network:
    driver: bridge