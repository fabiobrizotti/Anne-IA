services:
  n8n:
    image: n8nio/n8n:2.36.5
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
      - ./data/workflows:/backup/workflows
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: 'localhost', port: 5678, path: '/healthz', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-anne
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    env_file:
      - .env
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
      - ./data/rabbitmq-setup/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./data/rabbitmq-setup/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - ./data/evolution-api:/evolution/instances
    depends_on:
      - db-evolution
    networks:
      - public_net
      - data_net
  
  db-evolution:
    image: pgvector/pgvector:pg15
    container_name: db-evolution
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./data/postgresql-setup/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data_net
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  public_net:
    driver: bridge
  data_net:
    driver: bridge