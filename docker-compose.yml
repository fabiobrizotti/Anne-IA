services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "${N8N_HOST_BIND}:${N8N_PORT}:${N8N_PORT}"
    env_file:
      - .env
    environment:
      NODE_OPTIONS: ${N8N_NODE_OPTIONS}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
      - ./workflows:/workflows:rw
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: 'localhost', port: process.env.N8N_PORT, path: '/healthz', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # o 1º boot roda migrations no database.sqlite (pode passar de 50s)
  
# Importador Automatizado direto do GitHub (com suporte a subpastas)
# Idempotente: antes de importar, remove os workflows já existentes no
# database.sqlite (via setup/n8n/clean-workflows.js) para não falhar com
# SQLITE_CONSTRAINT ao recriar workflows com o mesmo ID.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n-import
    profiles: ["setup"]   # Executa apenas sob demanda
    depends_on:
      n8n:
        condition: service_healthy   # evita corrida de migrations no database.sqlite
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./setup/n8n:/setup-n8n:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[n8n-import] Aguardando estabilização do banco do n8n..."
        sleep 3

        echo "[n8n-import] Limpando workflows existentes (importação idempotente)..."
        node /setup-n8n/clean-workflows.js || echo "[n8n-import] WARNING: limpeza não aplicada"

        echo "[n8n-import] Baixando workflows do GitHub..."
        mkdir -p /tmp/repo_workflows

        if [ -n "$${GITHUB_TOKEN}" ]; then
          git clone -q "https://x-access-token:$${GITHUB_TOKEN}@github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows 2>/dev/null || {
            echo "[n8n-import] ERRO: Falha ao clonar repositório de workflows (verifique o GITHUB_TOKEN)"
            exit 1
          }
        else
          git clone -q "https://github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows || {
            echo "[n8n-import] ERRO: Falha ao clonar repositório de workflows"
            exit 1
          }
        fi

        echo "[n8n-import] Varrendo e importando todos os .json das subpastas..."
        failed=0
        imported=0

        for file in $$(find /tmp/repo_workflows/workflows -type f -name "*.json"); do
          echo "[n8n-import] Sanitizando e injetando: $$file"
          if ! node /setup-n8n/sanitize-workflow.js "$$file" /tmp/workflow-clean.json; then
            echo "[n8n-import] ERRO: Sanitização falhou, pulando $$file"
            failed=$$((failed + 1))
            continue
          fi

          success=0
          attempt=1
          while [ $$attempt -le 3 ]; do
            if n8n import:workflow --input="/tmp/workflow-clean.json"; then
              success=1
              imported=$$((imported + 1))
              break
            fi
            echo "[n8n-import] AVISO: Tentativa $$attempt falhou para $$file. Aguardando lock SQLite (2s)..."
            sleep 2
            attempt=$$((attempt + 1))
          done

          if [ $$success -eq 0 ]; then
            echo "[n8n-import] ERRO CRÍTICO: Falha definitiva ao importar $$file"
            failed=$$((failed + 1))
          fi
        done

        if [ $$failed -gt 0 ]; then
          echo "[n8n-import] ERRO: Houve $$failed falha(s) na importação de workflows!"
          exit 1
        fi

        echo "[n8n-import] Desativando (garantia) todos os fluxos importados..."
        n8n unpublish:workflow --all

        echo "[n8n-import] Concluído com sucesso ($$imported workflows importados)! Reinicie o n8n para aplicar as mudanças."
    networks:
      - data_net
    restart: "no"

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-anne
    ports:
      - "${RABBITMQ_HOST_BIND}:${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_HOST_BIND}:${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}"
    env_file:
      - .env
    entrypoint: /setup-rabbitmq/entrypoint.sh
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
      - ./setup/rabbitmq:/setup-rabbitmq:ro
      - ./setup/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  evolution-api:
    image: evoapicloud/evolution-api:${EVOLUTION_API_VERSION}
    container_name: evolution-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URLs Tailscale construídas dinamicamente (mudam junto com TAILSCALE_HOSTNAME)
      DASHBOARD_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${DASHBOARD_PORT}
      N8N_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${N8N_PORT}
      PGADMIN_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${PGADMIN_PORT}
      NINE_ROUTER_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${NINE_ROUTER_PORT}
    volumes:
      - ./data/evolution-api:/evolution/instances
    depends_on:
      - db-evolution
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Origin: http://localhost:3000' http://127.0.0.1:8080/manager/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-evolution:
    image: pgvector/pgvector:${PGVECTOR_VERSION}
    container_name: db-evolution
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_BIND}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./setup/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data_net
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d anneia -c 'SELECT 1 FROM clientes LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_HOST_BIND}:${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - ./data/redis:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG && redis-cli -a \"${REDIS_PASSWORD}\" INFO memory | grep -q 'used_memory_human:'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  9router:
    image: decolua/9router:${NINE_ROUTER_VERSION}
    container_name: 9router
    restart: unless-stopped
    ports:
      - "${NINE_ROUTER_HOST_BIND}:${NINE_ROUTER_PORT}:${NINE_ROUTER_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      # A imagem lê INITIAL_PASSWORD, não NINE_ROUTER_PASSWORD (ver README §5)
      INITIAL_PASSWORD: ${NINE_ROUTER_PASSWORD}
    volumes:
      - ./data/9router:/app/data
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${NINE_ROUTER_CONTAINER_PORT}/api/health && wget -q --spider http://127.0.0.1:${NINE_ROUTER_CONTAINER_PORT}/v1/models || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_HOST_BIND}:${PGADMIN_PORT}:${PGADMIN_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./setup/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Revisão/versão injetadas no build e expostas em /api/health.
        # `docker compose build` interpola do shell antes do .env, então o
        # update.sh exporta GIT_SHA=$(git rev-parse --short HEAD) no build.
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${DASHBOARD_VERSION:-unknown}
    image: anne-ia/dashboard:${DASHBOARD_VERSION}
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_BIND}:${DASHBOARD_PORT}:${DASHBOARD_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      PORT: ${DASHBOARD_CONTAINER_PORT}
      EVOLUTION_API_URL: http://evolution-api:${SERVER_PORT}
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${CHAVE_POSTGRES_PASSWORD}@db-evolution:${POSTGRES_CONTAINER_PORT}/anneia
      # Revisão em execução (gravada no .env pelo update.sh). Em runtime, para que
      # /api/health sempre reflita o HEAD aplicado — inclusive em updates que só
      # tocaram documentação e por isso não reconstroem a imagem.
      GIT_SHA: ${GIT_SHA:-unknown}
      APP_VERSION: ${DASHBOARD_VERSION:-unknown}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      NINE_ROUTER_URL: http://9router:${NINE_ROUTER_CONTAINER_PORT}/v1
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-${NINE_ROUTER_PASSWORD}}
      # Rate limit distribuído (db 7 é exclusivo do Dashboard; 6 é do n8n)
      REDIS_URL: redis://:${CHAVE_REDIS_PASSWORD}@redis:${REDIS_CONTAINER_PORT}/7
      # Observabilidade: retenção de system_logs e ingestão externa de eventos
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-}
      CPF_ENC_KEY: ${CPF_ENC_KEY:-}
      CPF_HMAC_KEY: ${CPF_HMAC_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      # URLs Tailscale construídas dinamicamente (mudam junto com TAILSCALE_HOSTNAME)
      DASHBOARD_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${DASHBOARD_PORT}
      N8N_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${N8N_PORT}
      PGADMIN_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${PGADMIN_PORT}
      NINE_ROUTER_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${NINE_ROUTER_PORT}
    networks:
      - public_net
      - data_net
    depends_on:
      evolution-api:
        condition: service_started
      db-evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${DASHBOARD_CONTAINER_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  public_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true