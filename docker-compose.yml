services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "${N8N_HOST_BIND}:${N8N_PORT}:${N8N_PORT}"
    env_file:
      - .env
    environment:
      NODE_OPTIONS: ${N8N_NODE_OPTIONS}
      EXECUTIONS_MODE: ${EXECUTIONS_MODE}
      QUEUE_BULL_REDIS_HOST: redis-n8n-queue
      QUEUE_BULL_REDIS_PORT: ${REDIS_N8N_QUEUE_CONTAINER_PORT}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_N8N_QUEUE_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
      - ./workflows:/workflows:rw
    networks:
      - frontend
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: 'localhost', port: process.env.N8N_PORT, path: '/healthz', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # o 1º boot roda migrations no database.sqlite (pode passar de 50s)

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n-worker
    restart: unless-stopped
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY}
    env_file:
      - .env
    environment:
      NODE_OPTIONS: ${N8N_NODE_OPTIONS}
      EXECUTIONS_MODE: ${EXECUTIONS_MODE}
      QUEUE_BULL_REDIS_HOST: redis-n8n-queue
      QUEUE_BULL_REDIS_PORT: ${REDIS_N8N_QUEUE_CONTAINER_PORT}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_N8N_QUEUE_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./files:/home/node/.n8n-files
    networks:
      - frontend
      - data_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 redis-n8n-queue 6379 && printf 'AUTH %s\r\nPING\r\n' \"${REDIS_N8N_QUEUE_PASSWORD}\" | nc -w 2 redis-n8n-queue 6379 | grep -q '+PONG'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  
# Importador Automatizado direto do GitHub (com suporte a subpastas)
# Idempotente: antes de importar, remove os workflows já existentes no
# database.sqlite (via setup/n8n/clean-workflows.js) para não falhar com
# SQLITE_CONSTRAINT ao recriar workflows com o mesmo ID.
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n-import
    profiles: ["setup"]   # Executa apenas sob demanda
    depends_on:
      n8n:
        condition: service_healthy   # evita corrida de migrations no database.sqlite
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./setup/n8n:/setup-n8n:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[n8n-import] Aguardando estabilização do banco do n8n..."
        sleep 3

        echo "[n8n-import] Limpando workflows existentes (importação idempotente)..."
        node /setup-n8n/clean-workflows.js || echo "[n8n-import] WARNING: limpeza não aplicada"

        echo "[n8n-import] Baixando workflows do GitHub..."
        mkdir -p /tmp/repo_workflows

        if [ -n "$${GITHUB_TOKEN}" ]; then
          git clone -q "https://x-access-token:$${GITHUB_TOKEN}@github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows 2>/dev/null || {
            echo "[n8n-import] ERRO: Falha ao clonar repositório de workflows (verifique o GITHUB_TOKEN)"
            exit 1
          }
        else
          git clone -q "https://github.com/fabiobrizotti/n8n_anneia_workflows.git" /tmp/repo_workflows || {
            echo "[n8n-import] ERRO: Falha ao clonar repositório de workflows"
            exit 1
          }
        fi

        echo "[n8n-import] Varrendo e importando todos os .json das subpastas..."
        failed=0
        imported=0

        for file in $$(find /tmp/repo_workflows/workflows -type f -name "*.json"); do
          echo "[n8n-import] Sanitizando e injetando: $$file"
          if ! node /setup-n8n/sanitize-workflow.js "$$file" /tmp/workflow-clean.json; then
            echo "[n8n-import] ERRO: Sanitização falhou, pulando $$file"
            failed=$$((failed + 1))
            continue
          fi

          success=0
          attempt=1
          while [ $$attempt -le 3 ]; do
            if n8n import:workflow --input="/tmp/workflow-clean.json"; then
              success=1
              imported=$$((imported + 1))
              break
            fi
            echo "[n8n-import] AVISO: Tentativa $$attempt falhou para $$file. Aguardando lock SQLite (2s)..."
            sleep 2
            attempt=$$((attempt + 1))
          done

          if [ $$success -eq 0 ]; then
            echo "[n8n-import] ERRO CRÍTICO: Falha definitiva ao importar $$file"
            failed=$$((failed + 1))
          fi
        done

        if [ $$failed -gt 0 ]; then
          echo "[n8n-import] ERRO: Houve $$failed falha(s) na importação de workflows!"
          exit 1
        fi

        echo "[n8n-import] Desativando (garantia) todos os fluxos importados..."
        n8n unpublish:workflow --all

        echo "[n8n-import] Concluído com sucesso ($$imported workflows importados)! Reinicie o n8n para aplicar as mudanças."
    networks:
      - data_net
    restart: "no"

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq-anne
    ports:
      - "${RABBITMQ_HOST_BIND}:${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_HOST_BIND}:${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}"
    env_file:
      - .env
    entrypoint: /setup-rabbitmq/entrypoint.sh
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
      - ./setup/rabbitmq:/setup-rabbitmq:ro
      - ./setup/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - frontend
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  evolution-api:
    image: evoapicloud/evolution-api:${EVOLUTION_API_VERSION}
    container_name: evolution-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URLs Tailscale construídas dinamicamente (mudam junto com TAILSCALE_HOSTNAME)
      DASHBOARD_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${DASHBOARD_PORT}
      N8N_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${N8N_PORT}
      PGADMIN_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${PGADMIN_PORT}
      LANGFUSE_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${LANGFUSE_PORT}
      # PgBouncer para conexão Postgres (Prisma requer ?pgbouncer=true)
      # Evolution API usa banco 'evolution' com user 'evolution' e senha do POSTGRES_PASSWORD
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:${PGBOUNCER_CONTAINER_PORT}/evolution?pgbouncer=true
    volumes:
      - ./data/evolution-api:/evolution/instances
    depends_on:
      - db-evolution
      - pgbouncer
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Origin: http://localhost:3000' http://127.0.0.1:8080/manager/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-evolution:
    image: pgvector/pgvector:${PGVECTOR_VERSION}
    container_name: db-evolution
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_BIND}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./setup/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data_net
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d anneia -c 'SELECT 1 FROM clientes LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_HOST_BIND}:${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - ./data/redis:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG && redis-cli -a \"${REDIS_PASSWORD}\" INFO memory | grep -q 'used_memory_human:'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-n8n-queue:
    image: redis:${REDIS_VERSION}
    container_name: redis-n8n-queue
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_N8N_QUEUE_PASSWORD}
      --maxmemory ${REDIS_N8N_QUEUE_MAXMEMORY}
      --maxmemory-policy ${REDIS_N8N_QUEUE_MAXMEMORY_POLICY}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_N8N_QUEUE_HOST_BIND}:${REDIS_N8N_QUEUE_PORT}:${REDIS_N8N_QUEUE_CONTAINER_PORT}"
    volumes:
      - ./data/redis-n8n-queue:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_N8N_QUEUE_PASSWORD}\" ping | grep PONG && redis-cli -a \"${REDIS_N8N_QUEUE_PASSWORD}\" INFO memory | grep -q 'used_memory_human:'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # LITELLM — GATEWAY OPENAI-COMPATIBLE (substitui o antigo 9Router)
  # ============================================================================
  litellm:
    image: litellm/litellm:${LITELLM_VERSION}
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_HOST_BIND}:${LITELLM_PORT}:${LITELLM_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${CHAVE_LITELLM_DB_PASSWORD}@db-evolution:${POSTGRES_CONTAINER_PORT}/litellm
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OR_SITE_URL: ${OR_SITE_URL}
      OR_APP_NAME: ${OR_APP_NAME}
      LITELLM_OTEL_V2: ${LITELLM_OTEL_V2}
      LITELLM_OTEL_LANGFUSE_SPAN_SCOPE: ${LITELLM_OTEL_LANGFUSE_SPAN_SCOPE}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
    command: ["--config", "/app/config.yaml", "--port", "${LITELLM_CONTAINER_PORT}"]
    volumes:
      - ./setup/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LITELLM_CONTAINER_PORT}/health/liveliness', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  # ============================================================================
  # LANGFUSE v4 — WEB + WORKER + CLICKHOUSE + MINIO + REDIS
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: UTC
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./setup/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${CLICKHOUSE_CONTAINER_PORT}/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536m

  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    command: sh -c "mkdir -p /data/langfuse && exec minio server /data"
    volumes:
      - ./data/minio:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  langfuse-redis:
    image: redis:${LANGFUSE_REDIS_VERSION}
    container_name: langfuse-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${LANGFUSE_REDIS_PASSWORD}
      --maxmemory ${LANGFUSE_REDIS_MAXMEMORY}
      --maxmemory-policy noeviction
      --appendonly yes
    env_file:
      - .env
    volumes:
      - ./data/langfuse-redis:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${LANGFUSE_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  langfuse-web:
    image: langfuse/langfuse:${LANGFUSE_VERSION}
    container_name: langfuse-web
    restart: unless-stopped
    ports:
      - "${LANGFUSE_HOST_BIND}:${LANGFUSE_PORT}:${LANGFUSE_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://langfuse:${CHAVE_LANGFUSE_DB_PASSWORD}@db-evolution:${POSTGRES_CONTAINER_PORT}/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:${CLICKHOUSE_CONTAINER_PORT}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_NATIVE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: ${LANGFUSE_REDIS_CONTAINER_PORT}
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX}
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${LANGFUSE_CONTAINER_PORT}/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

  langfuse-worker:
    image: langfuse/langfuse-worker:${LANGFUSE_VERSION}
    container_name: langfuse-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://langfuse:${CHAVE_LANGFUSE_DB_PASSWORD}@db-evolution:${POSTGRES_CONTAINER_PORT}/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:${CLICKHOUSE_CONTAINER_PORT}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_NATIVE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: ${LANGFUSE_REDIS_CONTAINER_PORT}
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX}
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${LANGFUSE_WORKER_CONTAINER_PORT}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_HOST_BIND}:${PGADMIN_PORT}:${PGADMIN_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./setup/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - frontend
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Revisão/versão injetadas no build e expostas em /api/health.
        # `docker compose build` interpola do shell antes do .env, então o
        # update.sh exporta GIT_SHA=$(git rev-parse --short HEAD) no build.
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${DASHBOARD_VERSION:-unknown}
    image: anne-ia/dashboard:${DASHBOARD_VERSION}
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_BIND}:${DASHBOARD_PORT}:${DASHBOARD_CONTAINER_PORT}"
    env_file:
      - .env
    environment:
      PORT: ${DASHBOARD_CONTAINER_PORT}
      EVOLUTION_API_URL: http://evolution-api:${SERVER_PORT}
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_URL: postgresql://pgbouncer_app:${CHAVE_PGBOUNCER_PASSWORD}@pgbouncer:${PGBOUNCER_CONTAINER_PORT}/anneia
      # Revisão em execução (gravada no .env pelo update.sh). Em runtime, para que
      # /api/health sempre reflita o HEAD aplicado — inclusive em updates que só
      # tocaram documentação e por isso não reconstroem a imagem.
      GIT_SHA: ${GIT_SHA:-unknown}
      APP_VERSION: ${DASHBOARD_VERSION:-unknown}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      # URL interna do gateway; a master key NÃO é enviada ao navegador.
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      # Rate limit distribuído (db 7 é exclusivo do Dashboard; 6 é do n8n)
      REDIS_URL: redis://:${CHAVE_REDIS_PASSWORD}@redis:${REDIS_CONTAINER_PORT}/7
      # Observabilidade: retenção de system_logs e ingestão externa de eventos
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-}
      CPF_ENC_KEY: ${CPF_ENC_KEY:-}
      CPF_HMAC_KEY: ${CPF_HMAC_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      # URLs Tailscale construídas dinamicamente (mudam junto com TAILSCALE_HOSTNAME)
      DASHBOARD_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${DASHBOARD_PORT}
      N8N_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${N8N_PORT}
      PGADMIN_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${PGADMIN_PORT}
      LANGFUSE_TAILSCALE_URL: http://${TAILSCALE_HOSTNAME}:${LANGFUSE_PORT}
      # Trust proxy IP para Nginx (quando ativo) — IP do container nginx na rede frontend
      # Se não definido, usa 'loopback' (compatibilidade acesso direto)
      NGINX_TRUST_PROXY_IP: ${NGINX_TRUST_PROXY_IP:-loopback}
    networks:
      - frontend
      - data_net
    depends_on:
      evolution-api:
        condition: service_started
      db-evolution:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${DASHBOARD_CONTAINER_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # PGBOUNCER — CONNECTION POOLER PARA POSTGRESQL
  # ============================================================================
  # Rede: data_net apenas (não exposto no host público)
  # Porta host: 127.0.0.1:6432 (via PGBOUNCER_HOST_BIND:PGBOUNCER_PORT)
  # Pools: anneia (transaction), anneia_session (session)
  # ============================================================================
  pgbouncer:
    image: pgbouncer/pgbouncer:1.23
    container_name: pgbouncer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Custom entrypoint variables
      POSTGRES_HOST: db-evolution
      POSTGRES_PORT: ${POSTGRES_CONTAINER_PORT}
      PGBOUNCER_PASSWORD: ${PGBOUNCER_PASSWORD}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      PGBOUNCER_LISTEN_ADDR: 0.0.0.0
      PGBOUNCER_CONTAINER_PORT: ${PGBOUNCER_CONTAINER_PORT}
      # For evolution database - passed to entrypoint to add to template
      EVOLUTION_DB_HOST: db-evolution
      EVOLUTION_DB_PORT: ${POSTGRES_CONTAINER_PORT}
      EVOLUTION_DB_USER: evolution
      EVOLUTION_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EVOLUTION_DB_NAME: evolution
      EVOLUTION_DB_POOL_MODE: transaction
      EVOLUTION_DB_POOL_SIZE: "10"
    ports:
      - "${PGBOUNCER_HOST_BIND}:${PGBOUNCER_PORT}:${PGBOUNCER_CONTAINER_PORT}"
    volumes:
      - ./setup/pgbouncer:/etc/pgbouncer:ro
    entrypoint: /etc/pgbouncer/entrypoint.sh
    networks:
      - data_net
    depends_on:
      db-evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 128m
    tmpfs:
      - /tmp
      - /var/run/postgresql
      - /run/pgbouncer:mode=1777

  # ============================================================================
  # NGINX — REVERSE PROXY HTTP (SEM TLS — TAILSCALE WIREGUARD)
  # ============================================================================
  # Rede: frontend (bridge) para alcançar serviços HTTP
  # Porta host: ${TAILSCALE_IP}:80 (bind no IP Tailscale da VPS)
  # Porta container: 8080
  # NÃO entra na data_net — isolamento de camada de dados
  # ============================================================================
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    user: "0:0"  # Run entrypoint as root to create directories, then drop to nginx user
    env_file:
      - .env
    environment:
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME}
      NGINX_CONTAINER_PORT: ${NGINX_CONTAINER_PORT}
      N8N_PORT: ${N8N_PORT}
      NGINX_RATE_LIMIT_LOGIN: ${NGINX_RATE_LIMIT_LOGIN}
      NGINX_RATE_LIMIT_API: ${NGINX_RATE_LIMIT_API}
      NGINX_RATE_LIMIT_BURST_LOGIN: ${NGINX_RATE_LIMIT_BURST_LOGIN}
      NGINX_RATE_LIMIT_BURST_API: ${NGINX_RATE_LIMIT_BURST_API}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE}
      NGINX_CLIENT_MAX_BODY_SIZE_CONHECIMENTO: ${NGINX_CLIENT_MAX_BODY_SIZE_CONHECIMENTO}
    ports:
      - "${NGINX_HOST_BIND}:${NGINX_PORT}:${NGINX_CONTAINER_PORT}"
    volumes:
      - ./setup/nginx:/etc/nginx:ro
    entrypoint: /etc/nginx/entrypoint.sh
    networks:
      - frontend
    depends_on:
      dashboard:
        condition: service_healthy
      n8n:
        condition: service_healthy
      pgadmin:
        condition: service_started
      # Sem rota no Nginx: esperar apenas o start evita travar o proxy se o
      # Langfuse estiver indisponível até o primeiro login (chaves do projeto).
      litellm:
        condition: service_started
      langfuse-web:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Host: ${TAILSCALE_HOSTNAME}' http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/log/nginx
      - /run/nginx
      - /tmp/nginx
      - /tmp/nginx/client_temp
      - /tmp/nginx/proxy_temp
      - /tmp/nginx/fastcgi_temp
      - /tmp/nginx/uwsgi_temp
      - /tmp/nginx/scgi_temp

networks:
  public_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  frontend:
    driver: bridge